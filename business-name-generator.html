<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Business Name Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

/* HEADER */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:#111827;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#3b82f6;
}

.back-btn{
    text-decoration:none;
    background:#3b82f6;
    color:white;
    padding:12px 22px;
    border-radius:8px;
}

.back-btn:hover{
    background:#2563eb;
}

/* MAIN */

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:60px 0;
}

.title{
    text-align:center;
    margin-bottom:50px;
}

.title h1{
    font-size:52px;
    margin-bottom:15px;
}

.title p{
    color:#cbd5e1;
    font-size:18px;
}

/* GENERATOR */

.generator-box{
    background:#1e293b;
    padding:40px;
    border-radius:25px;
}

.input-group{
    margin-bottom:25px;
}

.input-group label{
    display:block;
    margin-bottom:10px;
    font-size:16px;
}

.input-group input,
.input-group select{
    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:#0f172a;
    color:white;
    font-size:16px;
}

.generate-btn{
    width:100%;
    padding:18px;
    background:#3b82f6;
    border:none;
    border-radius:12px;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.generate-btn:hover{
    background:#2563eb;
}

/* RESULTS */

.results{
    margin-top:40px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.name-card{
    background:#111827;
    padding:25px;
    border-radius:15px;
    text-align:center;
    transition:0.3s;
}

.name-card:hover{
    transform:translateY(-5px);
}

.name-card h3{
    color:#3b82f6;
    margin-bottom:10px;
}

.name-card p{
    color:#cbd5e1;
    font-size:14px;
    margin-bottom:15px;
}

.copy-btn{
    background:#3b82f6;
    border:none;
    padding:10px 18px;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.copy-btn:hover{
    background:#2563eb;
}

/* MOBILE */

@media(max-width:768px){

    .title h1{
        font-size:36px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        AI Biz Tools
    </div>

    <a href="index.html" class="back-btn">
        ← Back Home
    </a>

</header>

<div class="container">

    <div class="title">

        <h1>AI Business Name Generator</h1>

        <p>
            Generate catchy startup and business names instantly.
        </p>

    </div>

    <div class="generator-box">

        <div class="input-group">

            <label>Business Keyword</label>

            <input type="text" id="keyword" placeholder="e.g. AI, Food, Fitness">

        </div>

        <div class="input-group">

            <label>Business Category</label>

            <select id="category">

                <option>Technology</option>
                <option>Food</option>
                <option>Fashion</option>
                <option>Health</option>
                <option>Education</option>
                <option>Finance</option>

            </select>

        </div>

        <button class="generate-btn" onclick="generateNames()">

            Generate Business Names

        </button>

        <div class="results" id="results"></div>

    </div>

</div>

<script>

function generateNames(){

    let keyword = document.getElementById("keyword").value;

    let category = document.getElementById("category").value;

    let results = document.getElementById("results");

    if(keyword === ""){

        results.innerHTML = "<p>Please enter a keyword.</p>";

        return;

    }

    let names = [

        keyword + "Hub",
        keyword + "ify",
        "Next" + keyword,
        keyword + "Boost",
        keyword + "Labs",
        keyword + "Flow",
        keyword + "Verse",
        keyword + "Nest"

    ];

    results.innerHTML = "";

    names.forEach(function(name){

        results.innerHTML += `

        <div class="name-card">

            <h3>${name}</h3>

            <p>${category} Business Name Idea</p>

            <button class="copy-btn" onclick="copyName('${name}')">

                Copy Name

            </button>

        </div>

        `;

    });

}

function copyName(name){

    navigator.clipboard.writeText(name);

    alert("Business name copied!");

}

</script>

</body>
</html>
