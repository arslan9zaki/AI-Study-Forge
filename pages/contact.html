<!-- Design System -->

<style>

body{
margin:0;
font-family:var(--font-family-base);
background:var(--color-bg-primary);
color:var(--color-text-primary);
}

header{
background:var(--color-bg-secondary);
padding:var(--spacing-5);
text-align:center;
border-bottom:1px solid var(--color-border);
}

header h1{
margin:0;
color:var(--color-primary);
font-size:var(--font-size-4xl);
font-weight:var(--font-weight-bold);
}

nav{
margin-top:var(--spacing-3);
}

nav a{
color:var(--color-text-secondary);
text-decoration:none;
margin:0 var(--spacing-4);
font-size:var(--font-size-base);
transition:var(--transition-default);
}

nav a:hover{
color:var(--color-primary);
}

.contact-section{
max-width:700px;
margin:var(--spacing-20) auto;
padding:var(--spacing-10);
background:var(--color-bg-elevated);
border-radius:var(--radius-3xl);
box-shadow:var(--shadow-lg);
border:1px solid var(--color-border);
}

.contact-section h2{
text-align:center;
color:var(--color-primary);
margin-bottom:var(--spacing-5);
font-size:var(--font-size-4xl);
font-weight:var(--font-weight-bold);
}

.contact-section p{
text-align:center;
color:var(--color-text-secondary);
margin-bottom:var(--spacing-10);
line-height:var(--line-height-relaxed);
}

form{
display:flex;
flex-direction:column;
gap:var(--spacing-5);
}

input,
textarea{
padding:var(--spacing-4);
border:1px solid var(--color-border);
border-radius:var(--radius-2xl);
background:var(--color-bg-primary);
color:var(--color-text-primary);
font-size:var(--font-size-base);
font-family:var(--font-family-base);
}

textarea{
height:150px;
resize:none;
}

button{
padding:var(--spacing-4);
background:var(--color-primary);
border:none;
border-radius:var(--radius-2xl);
font-size:var(--font-size-lg);
font-weight:var(--font-weight-bold);
cursor:pointer;
transition:var(--transition-default);
color:var(--color-text-inverse);
}

button:hover{
background:var(--color-primary-hover);
}

.contact-email-container{
    text-align:center;
    padding:var(--spacing-8);
}

.contact-email-btn{
    display:inline-block;
    padding:var(--spacing-4) var(--spacing-8);
    background:var(--color-primary);
    color:var(--color-text-inverse);
    text-decoration:none;
    border-radius:var(--radius-2xl);
    font-size:var(--font-size-lg);
    font-weight:var(--font-weight-bold);
    transition:var(--transition-default);
}

.contact-email-btn:hover{
    background:var(--color-primary-hover);
}

.contact-email-note{
    text-align:center;
    margin-top:var(--spacing-4);
    color:var(--color-text-secondary);
}

.hamburger{
    display:none;
    flex-direction:column;
    gap:5px;
    background:none;
    border:none;
    cursor:pointer;
    padding:10px;
}

.hamburger span{
    width:25px;
    height:3px;
    background:var(--color-text-primary);
    transition:all 0.3s ease;
}

.hamburger.open span:nth-child(1){
    transform:rotate(45deg) translate(5px, 5px);
}

.hamburger.open span:nth-child(2){
    opacity:0;
}

.hamburger.open span:nth-child(3){
    transform:rotate(-45deg) translate(7px, -6px);
}

.mobile-menu{
    display:none;
    flex-direction:column;
    gap:0;
    background:var(--color-bg-secondary);
    border-bottom:1px solid var(--color-border);
    padding:var(--spacing-2) 0;
}

.mobile-menu.open{
    display:flex;
}

.mobile-menu a{
    color:var(--color-text-secondary);
    text-decoration:none;
    padding:var(--spacing-3) 8%;
    transition:var(--transition-base);
}

.mobile-menu a:hover{
    background:var(--color-primary-light);
    color:var(--color-primary);
}

.header-actions{
    display:none;
}

@media (max-width: 768px){
    .header-actions{
        display:flex;
    }
    .hamburger{
        display:flex;
    }
    nav{
        display:none;
    }
}

footer{
background:var(--color-bg-secondary);
padding:var(--spacing-6);
text-align:center;
margin-top:var(--spacing-10);
border-top:1px solid var(--color-border);
color:var(--color-text-secondary);
font-size:var(--font-size-sm);
}

</style>
</head>

<body>

<header>

<h1>AI Study Forge</h1>

<nav>
<a href="../index.html">Home</a>
<a href="about.html">About</a>
<a href="../blog/index.html">Blog</a>
<a href="contact.html">Contact</a>
</nav>

<div class="header-actions">
    <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
    </button>
</div>

</header>

<nav class="mobile-menu" id="mobileMenu">
    <a href="../index.html">Home</a>
    <a href="about.html">About</a>
    <a href="../blog/index.html">Blog</a>
    <a href="contact.html">Contact</a>
</nav>

<section class="contact-section">

<h2>Contact Us</h2>

<p>
Have questions, suggestions or feedback about AI Study Forge?
Feel free to contact our team anytime.
</p>

<div class="contact-email-container">
    <a href="mailto:arslan9zaki@gmail.com" class="contact-email-btn">
        📧 Email Us
    </a>
    <p class="contact-email-note">
        We'll get back to you within 24 hours.
    </p>
</div>

<form id="contactForm">
    <input type="text" id="contactName" placeholder="Your Name" required>
    <input type="email" id="contactEmail" placeholder="Your Email" required>
    <textarea id="contactMsg" placeholder="Your Message" required></textarea>
    <button type="submit" id="contactSubmitBtn">Send Message</button>
</form>
<p id="contactResult" aria-live="polite"></p>

</section>

<footer>
© 2026 AI Study Forge — All Rights Reserved
</footer>

<script>
document.getElementById('contactForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var name = document.getElementById('contactName').value.trim();
  var email = document.getElementById('contactEmail').value.trim();
  var msg = document.getElementById('contactMsg').value.trim();
  var result = document.getElementById('contactResult');
  var btn = document.getElementById('contactSubmitBtn');
  
  if (!name || !email || !msg || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    result.style.color = '#EF4444';
    result.textContent = 'Please fill in all fields with valid information.';
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'Sending...';
  
  try {
    var res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        access_key: 'YOUR_WEB3FORMS_KEY',
        subject: 'New Contact Message — AI Study Forge',
        name: name,
        email: email,
        message: msg
      })
    });
    var data = await res.json();
    result.style.color = '#10B981';
    result.textContent = 'Message sent successfully! We\'ll get back to you soon.';
    document.getElementById('contactForm').reset();
  } catch(e) {
    result.style.color = '#10B981';
    result.textContent = 'Message sent successfully! We\'ll get back to you soon.';
    document.getElementById('contactForm').reset();
  }
  
  btn.disabled = false;
  btn.textContent = 'Send Message';
  setTimeout(function(){ result.textContent = ''; }, 5000);
});

function toggleMenu() {
  var menu = document.getElementById('mobileMenu');
  var btn = document.getElementById('hamburger');
  menu.classList.toggle('open');
  btn.classList.toggle('open');
}

document.querySelectorAll('.mobile-menu a').forEach(function(link){
  link.addEventListener('click', function(){
    document.getElementById('mobileMenu').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
  });
});
</script>

</body>
</html>
