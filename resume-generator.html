<script>
const state = {
  template: 'classic',
  skills: [],
  languages: [],
  experience: [],
  education: []
};

function switchTab(id) {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });

  document.querySelectorAll('.form-section').forEach(section => {
    section.classList.remove('active');
  });

  document.querySelector(`#tab-${id}`).classList.add('active');

  event.target.classList.add('active');
}

function selectTemplate(name, el) {
  state.template = name;

  document.querySelectorAll('.template-card').forEach(card => {
    card.classList.remove('selected');
  });

  el.classList.add('selected');

  render();
}

let expCount = 0;

function addExperience() {
  expCount++;

  state.experience.push({
    id: expCount,
    title: '',
    company: '',
    location: '',
    from: '',
    to: '',
    desc: ''
  });

  renderExperience();
  render();
}

function removeExperience(id) {
  state.experience = state.experience.filter(exp => exp.id !== id);

  renderExperience();
  render();
}

function renderExperience() {
  const container = document.getElementById('exp-list');

  container.innerHTML = '';

  state.experience.forEach((exp, index) => {
    container.innerHTML += `
      <div class="dynamic-item">
        <button class="remove-btn" onclick="removeExperience(${exp.id})">✕</button>

        <div class="form-group">
          <label>Job Title</label>
          <input type="text"
            value="${exp.title}"
            oninput="state.experience[${index}].title=this.value;render()">
        </div>

        <div class="form-group">
          <label>Company</label>
          <input type="text"
            value="${exp.company}"
            oninput="state.experience[${index}].company=this.value;render()">
        </div>

        <div class="form-group">
          <label>Duration</label>
          <input type="text"
            value="${exp.from}"
            placeholder="2022 - Present"
            oninput="state.experience[${index}].from=this.value;render()">
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea
            oninput="state.experience[${index}].desc=this.value;render()"
          >${exp.desc}</textarea>
        </div>
      </div>
    `;
  });
}

let eduCount = 0;

function addEducation() {
  eduCount++;

  state.education.push({
    id: eduCount,
    degree: '',
    school: '',
    year: ''
  });

  renderEducation();
  render();
}

function removeEducation(id) {
  state.education = state.education.filter(edu => edu.id !== id);

  renderEducation();
  render();
}

function renderEducation() {
  const container = document.getElementById('edu-list');

  container.innerHTML = '';

  state.education.forEach((edu, index) => {
    container.innerHTML += `
      <div class="dynamic-item">
        <button class="remove-btn" onclick="removeEducation(${edu.id})">✕</button>

        <div class="form-group">
          <label>Degree</label>
          <input type="text"
            value="${edu.degree}"
            oninput="state.education[${index}].degree=this.value;render()">
        </div>

        <div class="form-group">
          <label>School</label>
          <input type="text"
            value="${edu.school}"
            oninput="state.education[${index}].school=this.value;render()">
        </div>

        <div class="form-group">
          <label>Year</label>
          <input type="text"
            value="${edu.year}"
            oninput="state.education[${index}].year=this.value;render()">
        </div>
      </div>
    `;
  });
}

function addSkill() {
  const input = document.getElementById('skill-input');

  if (input.value.trim() !== '') {
    state.skills.push(input.value.trim());

    input.value = '';

    renderSkills();
    render();
  }
}

function removeSkill(skill) {
  state.skills = state.skills.filter(s => s !== skill);

  renderSkills();
  render();
}

function renderSkills() {
  const container = document.getElementById('skills-chips');

  container.innerHTML = '';

  state.skills.forEach(skill => {
    container.innerHTML += `
      <div class="chip">
        ${skill}
        <button onclick="removeSkill('${skill}')">✕</button>
      </div>
    `;
  });
}

function addLanguage() {
  const input = document.getElementById('lang-input');

  if (input.value.trim() !== '') {
    state.languages.push(input.value.trim());

    input.value = '';

    renderLanguages();
    render();
  }
}

function removeLanguage(lang) {
  state.languages = state.languages.filter(l => l !== lang);

  renderLanguages();
  render();
}

function renderLanguages() {
  const container = document.getElementById('lang-chips');

  container.innerHTML = '';

  state.languages.forEach(lang => {
    container.innerHTML += `
      <div class="chip">
        ${lang}
        <button onclick="removeLanguage('${lang}')">✕</button>
      </div>
    `;
  });
}

function getValue(id) {
  return document.getElementById(id).value;
}

function render() {
  const output = document.getElementById('resume-output');

  const firstName = getValue('f-first');
  const lastName = getValue('f-last');

  const fullName = `${firstName} ${lastName}`;

  const title = getValue('f-title');
  const email = getValue('f-email');
  const phone = getValue('f-phone');
  const location = getValue('f-location');
  const summary = getValue('f-summary');

  output.innerHTML = `
    <div class="tpl-${state.template}-resume">

      <div class="r-header">
        <div class="r-name">${fullName || 'Your Name'}</div>

        <div class="r-title">
          ${title || 'Professional Title'}
        </div>

        <div class="r-contact">
          ${email}
          ${phone ? ' • ' + phone : ''}
          ${location ? ' • ' + location : ''}
        </div>
      </div>

      <div class="r-body">

        <div class="r-main">

          <div class="r-section">
            <div class="r-section-title">Professional Summary</div>

            <div class="r-summary">
              ${summary || 'Write your professional summary here...'}
            </div>
          </div>

          <div class="r-section">
            <div class="r-section-title">Experience</div>

            ${
              state.experience.map(exp => `
                <div class="r-entry">
                  <div class="r-entry-title">
                    ${exp.title}
                  </div>

                  <div class="r-entry-sub">
                    ${exp.company}
                  </div>

                  <div class="r-entry-date">
                    ${exp.from}
                  </div>

                  <div class="r-entry-desc">
                    ${exp.desc}
                  </div>
                </div>
              `).join('')
            }

          </div>

          <div class="r-section">
            <div class="r-section-title">Education</div>

            ${
              state.education.map(edu => `
                <div class="r-entry">
                  <div class="r-entry-title">
                    ${edu.degree}
                  </div>

                  <div class="r-entry-sub">
                    ${edu.school}
                  </div>

                  <div class="r-entry-date">
                    ${edu.year}
                  </div>
                </div>
              `).join('')
            }

          </div>

        </div>

        <div class="r-sidebar">

          <div class="r-section">
            <div class="r-section-title">Skills</div>

            <div class="r-chip-list">
              ${
                state.skills.map(skill => `
                  <span class="r-chip">${skill}</span>
                `).join('')
              }
            </div>
          </div>

          <div class="r-section">
            <div class="r-section-title">Languages</div>

            <div class="r-chip-list">
              ${
                state.languages.map(lang => `
                  <span class="r-chip">${lang}</span>
                `).join('')
              }
            </div>
          </div>

        </div>

      </div>

    </div>
  `;
}

function clearAll() {
  location.reload();
}

function downloadPDF() {
  window.print();
}

render();
</script>
