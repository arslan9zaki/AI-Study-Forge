```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Resume Generator</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#0f172a;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
display:flex;
min-height:100vh;
}

.left{
width:40%;
background:#1e293b;
padding:20px;
overflow:auto;
}

.right{
width:60%;
background:#f8fafc;
padding:30px;
color:black;
}

input,textarea{
width:100%;
padding:12px;
margin-top:5px;
margin-bottom:15px;
border:none;
border-radius:8px;
font-size:15px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
font-size:15px;
margin-top:10px;
}

button:hover{
background:#1d4ed8;
}

.resume{
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 0 20px rgba(0,0,0,0.1);
}

.resume h1{
margin:0;
font-size:36px;
color:#111827;
}

.resume h2{
color:#2563eb;
margin-top:30px;
border-bottom:2px solid #2563eb;
padding-bottom:5px;
}

.skill{
display:inline-block;
background:#dbeafe;
padding:6px 12px;
margin:5px;
border-radius:20px;
}

.lang{
display:inline-block;
background:#dcfce7;
padding:6px 12px;
margin:5px;
border-radius:20px;
}
</style>
</head>

<body>

<header>
AI Resume Generator
</header>

<div class="container">

<div class="left">

<label>Full Name</label>
<input type="text" id="name" oninput="generateResume()">

<label>Professional Title</label>
<input type="text" id="title" oninput="generateResume()">

<label>Email</label>
<input type="text" id="email" oninput="generateResume()">

<label>Phone</label>
<input type="text" id="phone" oninput="generateResume()">

<label>Location</label>
<input type="text" id="location" oninput="generateResume()">

<label>Professional Summary</label>
<textarea id="summary" rows="5" oninput="generateResume()"></textarea>

<label>Skills (comma separated)</label>
<input type="text" id="skills" oninput="generateResume()">

<label>Languages (comma separated)</label>
<input type="text" id="languages" oninput="generateResume()">

<label>Experience</label>
<textarea id="experience" rows="6" oninput="generateResume()"></textarea>

<label>Education</label>
<textarea id="education" rows="5" oninput="generateResume()"></textarea>

<button onclick="window.print()">Download PDF</button>

</div>

<div class="right">

<div class="resume" id="resumePreview">

<h1>Your Name</h1>

<p>Professional Title</p>

</div>

</div>

</div>

<script>

function generateResume(){

const name=document.getElementById("name").value;
const title=document.getElementById("title").value;
const email=document.getElementById("email").value;
const phone=document.getElementById("phone").value;
const location=document.getElementById("location").value;
const summary=document.getElementById("summary").value;
const experience=document.getElementById("experience").value;
const education=document.getElementById("education").value;

const skills=document.getElementById("skills").value.split(",");
const languages=document.getElementById("languages").value.split(",");

let skillsHTML="";
skills.forEach(skill=>{
if(skill.trim()!==""){
skillsHTML+=`<span class="skill">${skill}</span>`;
}
});

let langHTML="";
languages.forEach(lang=>{
if(lang.trim()!==""){
langHTML+=`<span class="lang">${lang}</span>`;
}
});

document.getElementById("resumePreview").innerHTML=`

<h1>${name || "Your Name"}</h1>

<p>${title || "Professional Title"}</p>

<p>
${email}
${phone ? " | "+phone : ""}
${location ? " | "+location : ""}
</p>

<h2>Professional Summary</h2>
<p>${summary}</p>

<h2>Skills</h2>
${skillsHTML}

<h2>Languages</h2>
${langHTML}

<h2>Experience</h2>
<p>${experience.replace(/\n/g,"<br>")}</p>

<h2>Education</h2>
<p>${education.replace(/\n/g,"<br>")}</p>

`;

}

generateResume();

</script>

</body>
</html>
```
