<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; font-family:var(--font-family-base); }
html { scroll-behavior:smooth; }
body { background:var(--color-bg-primary); color:var(--color-text-primary); min-height:100vh; display:flex; flex-direction:column; }

/* Header */
.main-header { display:flex; justify-content:space-between; align-items:center; padding:var(--spacing-4) 8%; background:var(--color-surface-backdrop); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); position:sticky; top:0; z-index:var(--z-sticky); border-bottom:1px solid var(--color-border); }
.logo { font-size:var(--font-size-2xl); font-weight:var(--font-weight-extrabold); color:var(--color-primary); text-decoration:none; letter-spacing:var(--letter-spacing-tight); }
.logo span { color:var(--color-text-primary); }
.navbar { display:flex; gap:var(--spacing-7); align-items:center; }
.navbar a { color:var(--color-text-secondary); text-decoration:none; font-size:var(--font-size-base); font-weight:var(--font-weight-medium); transition:var(--transition-base); }
.navbar a:hover { color:var(--color-primary); }
.nav-btn { background:var(--color-primary); color:var(--color-text-inverse) !important; padding:var(--spacing-2) var(--spacing-5); border-radius:var(--radius-lg); font-weight:var(--font-weight-semibold) !important; font-size:var(--font-size-sm) !important; transition:var(--transition-base); }
.nav-btn:hover { background:var(--color-primary-hover) !important; }
.hamburger { display:none; flex-direction:column; gap:var(--spacing-1); cursor:pointer; padding:var(--spacing-1); background:none; border:none; }
.hamburger span { display:block; width:25px; height:2px; background:var(--color-text-primary); border-radius:var(--radius-sm); transition:var(--transition-base); }
.hamburger.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2){ opacity:0; }
.hamburger.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
.mobile-menu { display:none; flex-direction:column; background:var(--color-bg-elevated); border-top:1px solid var(--color-border); }
.mobile-menu.open { display:flex; }
.mobile-menu a { color:var(--color-text-secondary); text-decoration:none; padding:var(--spacing-3) 8%; font-size:var(--font-size-base); font-weight:var(--font-weight-medium); border-bottom:1px solid var(--color-border); transition:var(--transition-base); }
.mobile-menu a:hover { background:var(--color-primary-light); color:var(--color-primary); }
.mobile-menu .nav-btn { margin:var(--spacing-3) 8%; border-radius:var(--radius-lg); text-align:center; border-bottom:none; padding:var(--spacing-3); }

/* Hero */
.page-hero { text-align:center; padding:var(--spacing-16) var(--spacing-5) var(--spacing-10); background:linear-gradient(135deg,var(--color-bg-primary),var(--color-bg-secondary)); position:relative; overflow:hidden; }
.page-hero::before { content:''; position:absolute; width:500px; height:500px; background:radial-gradient(circle,var(--color-primary-light),transparent 70%); top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; }
.badge { display:inline-flex; align-items:center; gap:var(--spacing-2); background:var(--color-primary-light); border:1px solid var(--color-primary); color:var(--color-primary); font-size:var(--font-size-xs); font-weight:var(--font-weight-semibold); padding:var(--spacing-2) var(--spacing-4); border-radius:var(--radius-full); margin-bottom:var(--spacing-4); }
.page-hero h1 { font-size:clamp(28px,5vw,48px); font-weight:var(--font-weight-extrabold); margin-bottom:var(--spacing-3); letter-spacing:var(--letter-spacing-tight); }
.page-hero h1 span { background:linear-gradient(135deg,var(--color-primary),var(--color-primary-hover)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.page-hero p { color:var(--color-text-secondary); font-size:var(--font-size-base); max-width:500px; margin:0 auto; line-height:var(--line-height-relaxed); }

/* Filter tabs */
.filter-bar { display:flex; justify-content:center; gap:var(--spacing-2); flex-wrap:wrap; padding:var(--spacing-7) 5% 0; }
.filter-btn { padding:var(--spacing-2) var(--spacing-4); border-radius:var(--radius-full); border:1px solid var(--color-border); background:transparent; color:var(--color-text-tertiary); font-size:var(--font-size-xs); font-weight:var(--font-weight-medium); cursor:pointer; font-family:var(--font-family-base); transition:var(--transition-base); }
.filter-btn:hover { border-color:var(--color-primary); color:var(--color-primary); }
.filter-btn.active { background:var(--color-primary-light); border-color:var(--color-primary); color:var(--color-primary); }

/* Blog grid */
.container { flex:1; max-width:1200px; margin:0 auto; padding:var(--spacing-9) 5% var(--spacing-16); width:100%; }
.post-count { font-size:var(--font-size-xs); color:var(--color-text-tertiary); margin-bottom:var(--spacing-6); }
.blog-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:var(--spacing-7); }

/* Blog card */
.blog-card { background:var(--color-bg-elevated); border-radius:var(--radius-3xl); border:1px solid var(--color-border); overflow:hidden; display:flex; flex-direction:column; transition:var(--transition-slow); cursor:pointer; min-height:420px; }
.blog-card:hover { transform:translateY(-8px); box-shadow:var(--shadow-2xl); border-color:var(--color-primary); }
.card-thumb { height:200px; display:flex; align-items:center; justify-content:center; font-size:64px; position:relative; overflow:hidden; }
.thumb-blue   { background:linear-gradient(135deg,#1e3a5f,#1e293b); }
.thumb-purple { background:linear-gradient(135deg,#2d1b5e,#1e293b); }
.thumb-green  { background:linear-gradient(135deg,#0f3328,#1e293b); }
.thumb-orange { background:linear-gradient(135deg,#3d2000,#1e293b); }
.thumb-red    { background:linear-gradient(135deg,#3d0a00,#1e293b); }
.card-body { padding:var(--spacing-7); flex:1; display:flex; flex-direction:column; }
.card-meta { display:flex; align-items:center; gap:var(--spacing-3); margin-bottom:var(--spacing-4); flex-wrap:wrap; }
.card-tag { font-size:var(--font-size-xs); font-weight:var(--font-weight-bold); text-transform:uppercase; letter-spacing:var(--letter-spacing-wide); padding:var(--spacing-2) var(--spacing-3); border-radius:var(--radius-full); background:linear-gradient(135deg,var(--color-primary-light),var(--color-primary)); color:var(--color-text-inverse); }
.card-date { font-size:var(--font-size-xs); color:var(--color-text-tertiary); font-weight:var(--font-weight-medium); }
.card-read { font-size:var(--font-size-xs); color:var(--color-text-tertiary); font-weight:var(--font-weight-medium); display:flex; align-items:center; gap:var(--spacing-1); }
.blog-card h2 { font-size:var(--font-size-xl); font-weight:var(--font-weight-bold); line-height:var(--line-height-tight); margin-bottom:var(--spacing-3); color:var(--color-text-primary); }
.blog-card p { color:var(--color-text-secondary); line-height:var(--line-height-relaxed); font-size:var(--font-size-base); flex:1; margin-bottom:var(--spacing-6); display:-webkit-box; -webkit-line-clamp:3; line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.read-btn { display:inline-flex; align-items:center; gap:var(--spacing-2); padding:var(--spacing-3) var(--spacing-5); background:var(--color-primary); color:var(--color-text-inverse); text-decoration:none; border-radius:var(--radius-xl); font-size:var(--font-size-sm); font-weight:var(--font-weight-semibold); transition:var(--transition-default); align-self:flex-start; border:none; cursor:pointer; font-family:var(--font-family-base); box-shadow:var(--shadow-md); }
.read-btn:hover { background:var(--color-primary-hover); transform:translateY(-2px); box-shadow:var(--shadow-lg); }

/* No results */
.no-results { text-align:center; padding:var(--spacing-16) var(--spacing-5); color:var(--color-text-tertiary); }
.no-results p { font-size:var(--font-size-base); margin-top:var(--spacing-3); }

/* Footer */
footer { padding:var(--spacing-6); text-align:center; border-top:1px solid var(--color-border); color:var(--color-text-secondary); font-size:var(--font-size-sm); display:flex; justify-content:center; align-items:center; gap:var(--spacing-7); flex-wrap:wrap; }
.footer-links { display:flex; gap:var(--spacing-5); }
.footer-links a { color:var(--color-text-secondary); text-decoration:none; transition:var(--transition-base); }
.footer-links a:hover { color:var(--color-primary); }

/* Tablet */
@media(max-width:1024px){
    .blog-grid{ grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:var(--spacing-6); }
}

/* Mobile */
@media(max-width:768px){
    .navbar { display:none; }
    .hamburger { display:flex; }
    .blog-grid { grid-template-columns:1fr; }
    .card-thumb{ height:180px; font-size:56px; }
    .blog-card{ min-height:380px; }
}

/* Small Mobile */
@media(max-width:480px){
    .blog-card{ min-height:360px; }
    .card-thumb{ height:160px; font-size:48px; }
    .card-body{ padding:var(--spacing-5); }
    .blog-card h2{ font-size:var(--font-size-lg); }
    .blog-card p{ font-size:var(--font-size-sm); }
}
</style>

    <a href="../pages/contact.html">Contact</a>
    <a href="../tools/content-writer/index.html" class="nav-btn">ðŸš€ Try Free Tools</a>
</nav>

<section class="page-hero">
    <div class="badge">ðŸ“ Latest Articles</div>
    <h1>AI Biz <span>Blog</span></h1>
    <p>Guides on AI tools, online earning, career tips and automation for 2026.</p>
</section>

<div class="filter-bar" id="filterBar"></div>

<div class="container">
    <p class="post-count" id="postCount"></p>
    <div class="blog-grid" id="blogGrid"></div>
</div>

<footer>
    <span>Â© 2026 AI Biz Tools â€” All Rights Reserved</span>
    <div class="footer-links">
        <a href="../index.html">Home</a>

        <a href="../pages/privacy.html">Privacy</a>
        <a href="../pages/terms.html">Terms</a>
    </div>
</footer>

<script>
const THUMBS = ['thumb-blue','thumb-purple','thumb-green','thumb-orange','thumb-red'];
let allPosts = [];
let activeFilter = 'All';

function toggleMenu(){
    document.getElementById('mobileMenu').classList.toggle('open');
    document.getElementById('hamburger').classList.toggle('open');
}

function renderPosts(posts) {
    const grid  = document.getElementById('blogGrid');
    const count = document.getElementById('postCount');
    count.textContent = `${posts.length} article${posts.length !== 1 ? 's' : ''}`;

    if (posts.length === 0) {
        grid.innerHTML = `<div class="no-results"><div style="font-size:48px">ðŸ”</div><p>No articles found in this category.</p></div>`;
        return;
    }

    grid.innerHTML = posts.map((post, i) => `
        <div class="blog-card" onclick="openPost('${post.id}')">
            <div class="card-thumb ${THUMBS[i % THUMBS.length]}">${post.emoji}</div>
            <div class="card-body">
                <div class="card-meta">
                    <span class="card-tag">${post.category}</span>
                    <span class="card-date">${post.date}</span>
                    <span class="card-read">â± ${post.readTime}</span>
                </div>
                <h2>${post.title}</h2>
                <p>${post.excerpt}</p>
                <button class="read-btn">Read Article â†’</button>
            </div>
        </div>
    `).join('');
}

function renderFilters(posts) {
    const categories = ['All', ...new Set(posts.map(p => p.category))];
    const bar = document.getElementById('filterBar');
    bar.innerHTML = categories.map(cat => `
        <button class="filter-btn ${cat === 'All' ? 'active' : ''}"
            onclick="filterPosts('${cat}', this)">${cat}</button>
    `).join('');
}

function filterPosts(category, btn) {
    activeFilter = category;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtered = category === 'All' ? allPosts : allPosts.filter(p => p.category === category);
    renderPosts(filtered);
}

function openPost(id) {
    window.location.href = `post.html?id=${id}`;
}

// Load posts from JSON
fetch('posts.json')
    .then(r => r.json())
    .then(posts => {
        allPosts = posts;
        renderFilters(posts);
        renderPosts(posts);
    })
    .catch(() => {
        document.getElementById('blogGrid').innerHTML =
            `<div class="no-results"><p>Could not load posts. Make sure posts.json is in the same folder.</p></div>`;
    });
</script>

<!-- Theme System -->
<script src="../assets/js/theme.js"></script>
