<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Post | AI Biz Tools</title>
<meta name="description" content="">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
html { scroll-behavior:smooth; }
body { background:#0f172a; color:white; min-height:100vh; display:flex; flex-direction:column; }

/* Header */
.main-header { display:flex; justify-content:space-between; align-items:center; padding:18px 8%; background:rgba(15,23,42,0.95); backdrop-filter:blur(12px); position:sticky; top:0; z-index:1000; border-bottom:1px solid rgba(59,130,246,0.15); }
.logo { font-size:24px; font-weight:800; color:#3b82f6; text-decoration:none; letter-spacing:-0.5px; }
.logo span { color:white; }
.navbar { display:flex; gap:26px; align-items:center; }
.navbar a { color:#cbd5e1; text-decoration:none; font-size:15px; font-weight:500; transition:0.3s; }
.navbar a:hover { color:#3b82f6; }
.nav-btn { background:#3b82f6; color:white !important; padding:10px 20px; border-radius:8px; font-weight:600 !important; font-size:14px !important; }
.nav-btn:hover { background:#2563eb !important; }
.hamburger { display:none; flex-direction:column; gap:5px; cursor:pointer; padding:4px; background:none; border:none; }
.hamburger span { display:block; width:25px; height:2px; background:white; border-radius:2px; transition:0.3s; }
.hamburger.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2){ opacity:0; }
.hamburger.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
.mobile-menu { display:none; flex-direction:column; background:#1e293b; border-top:1px solid rgba(59,130,246,0.2); }
.mobile-menu.open { display:flex; }
.mobile-menu a { color:#cbd5e1; text-decoration:none; padding:14px 8%; font-size:15px; border-bottom:1px solid rgba(255,255,255,0.05); transition:0.2s; }
.mobile-menu a:hover { background:rgba(59,130,246,0.1); color:#3b82f6; }

/* Back bar */
.back-bar { padding:20px 8%; }
.back-link { display:inline-flex; align-items:center; gap:8px; color:#64748b; text-decoration:none; font-size:14px; font-weight:500; transition:0.2s; }
.back-link:hover { color:#3b82f6; }

/* Article wrapper */
.article-wrap { flex:1; max-width:820px; margin:0 auto; padding:0 5% 80px; width:100%; }

/* Hero */
.post-hero { text-align:center; padding:40px 0 48px; }
.post-emoji { font-size:64px; margin-bottom:20px; display:block; }
.post-tag { display:inline-flex; align-items:center; background:rgba(59,130,246,0.12); border:1px solid rgba(59,130,246,0.25); color:#93c5fd; font-size:12px; font-weight:600; padding:6px 14px; border-radius:50px; margin-bottom:20px; }
.post-title { font-size:clamp(26px,4vw,42px); font-weight:800; line-height:1.2; letter-spacing:-0.5px; margin-bottom:20px; color:#f1f5f9; }
.post-meta { display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; font-size:13px; color:#475569; }
.post-meta span { display:flex; align-items:center; gap:5px; }

/* Divider */
.divider { height:1px; background:rgba(255,255,255,0.07); margin:0 0 48px; }

/* Article content */
.article-content { color:#cbd5e1; font-size:16px; line-height:1.85; }

.article-intro {
    font-size:18px;
    line-height:1.8;
    color:#94a3b8;
    background:rgba(59,130,246,0.06);
    border-left:3px solid #3b82f6;
    padding:20px 24px;
    border-radius:0 12px 12px 0;
    margin-bottom:36px;
}

.article-heading {
    font-size:22px;
    font-weight:700;
    color:#f1f5f9;
    margin:40px 0 16px;
    padding-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,0.07);
}

.article-paragraph {
    margin-bottom:24px;
    color:#94a3b8;
    line-height:1.85;
}

.article-conclusion {
    background:rgba(59,130,246,0.06);
    border:1px solid rgba(59,130,246,0.15);
    border-radius:14px;
    padding:28px;
    margin-top:40px;
    color:#93c5fd;
    font-size:16px;
    line-height:1.8;
}

/* CTA box */
.cta-box {
    background:#1e293b;
    border:1px solid rgba(59,130,246,0.2);
    border-radius:16px;
    padding:32px;
    text-align:center;
    margin-top:52px;
}
.cta-box h3 { font-size:20px; font-weight:700; margin-bottom:10px; color:#f1f5f9; }
.cta-box p { color:#64748b; font-size:15px; margin-bottom:22px; line-height:1.7; }
.cta-btn { display:inline-flex; align-items:center; gap:8px; padding:13px 28px; background:#3b82f6; color:white; text-decoration:none; border-radius:10px; font-size:15px; font-weight:600; transition:0.3s; }
.cta-btn:hover { background:#2563eb; }

/* Related posts */
.related-section { margin-top:60px; padding-top:40px; border-top:1px solid rgba(255,255,255,0.07); }
.related-section h3 { font-size:20px; font-weight:700; margin-bottom:24px; color:#f1f5f9; }
.related-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
.related-card { background:#1e293b; border:1px solid rgba(255,255,255,0.07); border-radius:12px; padding:18px; cursor:pointer; transition:0.2s; }
.related-card:hover { border-color:rgba(59,130,246,0.3); transform:translateY(-3px); }
.related-card .r-emoji { font-size:28px; margin-bottom:10px; display:block; }
.related-card .r-tag { font-size:11px; font-weight:600; color:#60a5fa; text-transform:uppercase; letter-spacing:0.3px; margin-bottom:8px; }
.related-card h4 { font-size:14px; font-weight:600; color:#e2e8f0; line-height:1.4; }

/* Not found */
.not-found { text-align:center; padding:80px 20px; }
.not-found h2 { font-size:24px; color:#f87171; margin-bottom:12px; }
.not-found p { color:#64748b; margin-bottom:24px; }
.not-found a { color:#3b82f6; text-decoration:none; }

/* Footer */
footer { padding:24px; text-align:center; border-top:1px solid rgba(255,255,255,0.07); color:#475569; font-size:14px; display:flex; justify-content:center; align-items:center; gap:28px; flex-wrap:wrap; }
.footer-links { display:flex; gap:20px; }
.footer-links a { color:#475569; text-decoration:none; transition:0.2s; }
.footer-links a:hover { color:#3b82f6; }

@media(max-width:768px){
    .navbar { display:none; }
    .hamburger { display:flex; }
    .post-title { font-size:26px; }
    .article-intro { font-size:16px; }
    .article-heading { font-size:19px; }
}
</style>
</head>
<body>

<header class="main-header">
    <a href="../index.html" class="logo">AI <span>Biz</span> Tools</a>
    <nav class="navbar">
        <a href="../index.html">Home</a>
        <a href="../pages/about.html">About</a>
        <a href="index.html">Blog</a>
        <a href="../pages/contact.html">Contact</a>
        <a href="../tools/content-writer/index.html" class="nav-btn">🚀 Try Free Tools</a>
    </nav>
    <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
</header>
<nav class="mobile-menu" id="mobileMenu">
    <a href="../index.html">Home</a>
    <a href="../pages/about.html">About</a>
    <a href="index.html">Blog</a>
    <a href="../pages/contact.html">Contact</a>
    <a href="../tools/content-writer/index.html" class="nav-btn">🚀 Try Free Tools</a>
</nav>

<div class="back-bar">
    <a href="index.html" class="back-link">← Back to Blog</a>
</div>

<div class="article-wrap" id="articleWrap">
    <div style="text-align:center;padding:60px 0;color:#475569">Loading article...</div>
</div>

<footer>
    <span>© 2026 AI Biz Tools — All Rights Reserved</span>
    <div class="footer-links">
        <a href="../index.html">Home</a>
        <a href="../pages/about.html">About</a>
        <a href="../pages/privacy.html">Privacy</a>
        <a href="../pages/terms.html">Terms</a>
    </div>
</footer>

<script>
function toggleMenu(){
    document.getElementById('mobileMenu').classList.toggle('open');
    document.getElementById('hamburger').classList.toggle('open');
}

function renderBlock(block) {
    switch(block.type) {
        case 'intro':
            return `<div class="article-intro">${block.text}</div>`;
        case 'heading':
            return `<h2 class="article-heading">${block.text}</h2>`;
        case 'paragraph':
            return `<p class="article-paragraph">${block.text}</p>`;
        case 'conclusion':
            return `<div class="article-conclusion"><strong>✅ Conclusion:</strong> ${block.text}</div>`;
        default:
            return `<p class="article-paragraph">${block.text}</p>`;
    }
}

function renderRelated(posts, currentId) {
    const related = posts.filter(p => p.id !== currentId).slice(0, 3);
    if (related.length === 0) return '';
    return `
        <div class="related-section">
            <h3>Related Articles</h3>
            <div class="related-grid">
                ${related.map(p => `
                    <div class="related-card" onclick="window.location.href='post.html?id=${p.id}'">
                        <span class="r-emoji">${p.emoji}</span>
                        <div class="r-tag">${p.category}</div>
                        <h4>${p.title}</h4>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
}

// Get post ID from URL
const params = new URLSearchParams(window.location.search);
const postId = params.get('id');

if (!postId) {
    document.getElementById('articleWrap').innerHTML = `
        <div class="not-found">
            <h2>No post specified</h2>
            <p>Please go back to the blog and select an article.</p>
            <a href="index.html">← Back to Blog</a>
        </div>`;
} else {
    fetch('posts.json')
        .then(r => r.json())
        .then(posts => {
            const post = posts.find(p => p.id === postId);

            if (!post) {
                document.getElementById('articleWrap').innerHTML = `
                    <div class="not-found">
                        <h2>Article not found</h2>
                        <p>This article does not exist or may have been removed.</p>
                        <a href="index.html">← Back to Blog</a>
                    </div>`;
                return;
            }

            // Update page title and meta
            document.title = `${post.title} | AI Biz Tools`;
            document.querySelector('meta[name="description"]').content = post.excerpt;

            // Render article
            document.getElementById('articleWrap').innerHTML = `
                <div class="post-hero">
                    <span class="post-emoji">${post.emoji}</span>
                    <div class="post-tag">${post.category}</div>
                    <h1 class="post-title">${post.title}</h1>
                    <div class="post-meta">
                        <span>📅 ${post.date}</span>
                        <span>⏱ ${post.readTime}</span>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="article-content">
                    ${post.content.map(renderBlock).join('')}
                </div>

                <div class="cta-box">
                    <h3>🚀 Try Our Free AI Tools</h3>
                    <p>Put what you just learned into action. Our free AI tools help you write content, build resumes, craft cover letters and prepare for interviews — all in seconds.</p>
                    <a href="../index.html#tools" class="cta-btn">Explore Free Tools →</a>
                </div>

                ${renderRelated(posts, post.id)}
            `;
        })
        .catch(() => {
            document.getElementById('articleWrap').innerHTML = `
                <div class="not-found">
                    <h2>Could not load article</h2>
                    <p>Make sure posts.json is in the same folder as this file.</p>
                    <a href="index.html">← Back to Blog</a>
                </div>`;
        });
}
</script>
</body>
</html>
